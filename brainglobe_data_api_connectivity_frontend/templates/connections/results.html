{% extends "base.html" %}

{% load crispy_forms_tags %}

{% block title %}Results{% endblock title %}
{% block content %}
  <h1>Results</h1>
  <p class="text-center">Query completed successfully - {{ result.n_rows }} rows returned.</p>
  <div class="d-flex justify-content-center gap-2">
    <a href="{% url 'connections:download_results' result.id %}"
       class="btn btn-primary">Download CSV ({{ result.result_file.size|filesizeformat }})</a>
    <a href="{% url 'connections:browse_connections' result.sex %}"
       class="btn btn-secondary">Run another query</a>
  </div>
{% endblock content %}

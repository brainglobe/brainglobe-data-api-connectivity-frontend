volumes:
  brainglobe_data_api_connectivity_frontend_local_postgres_data: {}
  brainglobe_data_api_connectivity_frontend_local_postgres_data_backups: {}


services:
  django:
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: brainglobe_data_api_connectivity_frontend_local_django
    container_name: brainglobe_data_api_connectivity_frontend_local_django
    depends_on:
      - postgres
    volumes:
      - /app/.venv
      - .:/app:z
    env_file:
      - path: ./.envs/.local/.django
        required: false
      - path: ./.envs/.local/.postgres
        required: false
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: brainglobe_data_api_connectivity_frontend_production_postgres
    container_name: brainglobe_data_api_connectivity_frontend_local_postgres
    volumes:
      - brainglobe_data_api_connectivity_frontend_local_postgres_data:/var/lib/postgresql/18/docker
      - brainglobe_data_api_connectivity_frontend_local_postgres_data_backups:/backups
    env_file:
      - path: ./.envs/.local/.postgres
        required: false
    ports:
      - '5433:5432'
